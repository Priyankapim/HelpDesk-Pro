
<!DOCTYPE html>

{% load static %}
<html>
<head>
    <title>Login - HelpDesk Pro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f4f7fc;
            height:100vh;
        }

        .login-card{
            border:none;
            border-radius:20px;
            overflow:hidden;
            box-shadow:0 10px 30px rgba(0,0,0,0.1);
        }

        .left-section{
            background:white;
            padding:50px;
        }

        .right-section{
            background:linear-gradient(135deg,#2563eb,#1e40af);
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            flex-direction:column;
        }

        .brand-title{
            font-weight:700;
            font-size:32px;
        }

        .login-btn{
            width:100%;
            background:#2563eb;
            border:none;
            padding:12px;
            border-radius:10px;
        }

        .login-btn:hover{
            background:#1e40af;
        }
    </style>
</head>
<body>

<div class="container h-100">
    <div class="row h-100 justify-content-center align-items-center">

        <div class="col-lg-10">
            <div class="card login-card">

                <div class="row g-0">

                    <div class="col-md-6 left-section">

                        <h2 class="mb-3">Welcome Back</h2>

                        <p class="text-muted mb-4">
                            Login to access HelpDesk Pro
                        </p>

                        {% if messages %}

                            {% for message in messages %}

                                <div class="alert alert-{{ message.tags }} mb-3">

                                    {{ message }}

                                </div>

                            {% endfor %}

                        {% endif %}

                        <form method="post">
                            {% csrf_token %}

                            <div class="mb-3">
                                <label>Email</label>
                                <input type="email"
                                       class="form-control"
                                       name="email"
                                       value="{{ email }}"
                                       required>
                            </div>

                            <div class="mb-4">
                                <label>Password</label>
                                <input type="password"
                                       class="form-control"
                                       name="password"
                                       required>

                                <div class="text-end mt-2">
                                    <a href="{% url 'forgot_password' %}" class="text-decoration-none small">
                                        Forgot Password?
                                    </a>
                                </div>
                            </div>

                            <button type="submit"
                                    class="btn btn-primary login-btn">
                                Login
                            </button>
                        </form>

                    </div>

                    <div class="col-md-6 right-section">

                        <h1 class="brand-title">
                            HelpDesk Pro
                        </h1>

                        <p class="mt-3">
                            Enterprise Ticket Management System
                        </p>

                    </div>

                </div>

            </div>
        </div>

    </div>
</div>

</body>
</html>

{% extends 'base.html' %}

{% block title %}
Create Ticket
{% endblock %}

{% block page_title %}
Create Ticket
{% endblock %}

{% block content %}

<div class="card shadow-sm border-0">

    <div class="card-body p-4">

        <form method="POST">

            {% csrf_token %}

            <!-- Title -->

            <div class="mb-3">

                <label class="form-label fw-semibold">
                    Title
                </label>

                {{ form.title }}

            </div>

            <!-- Description -->

            <div class="mb-3">

                <label class="form-label fw-semibold">
                    Description
                </label>

                {{ form.description }}

            </div>

            <div class="row">

                <!-- Department -->

                <div class="col-md-6 mb-3">

                    <label class="form-label fw-semibold">
                        Department
                    </label>

                    {{ form.department }}

                </div>

                <!-- Priority -->

                <div class="col-md-6 mb-3">

                    <label class="form-label fw-semibold">
                        Priority
                    </label>

                    {{ form.priority }}

                </div>

            </div>

            <div class="mt-4">

                <button type="submit" class="btn btn-primary px-4">
                    Submit Ticket
                </button>

                <a href="{% url 'dashboard' %}" class="btn btn-secondary ms-2">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}

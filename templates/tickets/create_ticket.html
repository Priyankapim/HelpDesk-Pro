{% extends 'base.html' %}

{% block title %}
Create Ticket
{% endblock %}

{% block content %}

<div class="card">

    <div class="card-header">
        <h4>Create Ticket</h4>
    </div>

    <div class="card-body">

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button class="btn btn-primary">
                Submit Ticket
            </button>

        </form>

    </div>

</div>

{% endblock %}

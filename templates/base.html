<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HelpDesk Pro{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f5f7fb;
            margin:0;
        }

        .sidebar{
            width:250px;
            height:100vh;
            position:fixed;
            left:0;
            top:0;
            background:white;
            border-right:1px solid #e5e7eb;
        }

        .logo{
            padding:20px;
            font-size:24px;
            font-weight:bold;
            color:#2563eb;
            border-bottom:1px solid #e5e7eb;
        }

        .menu{
            padding:20px;
        }

        .menu a{
            display:block;
            text-decoration:none;
            color:#374151;
            padding:12px;
            border-radius:10px;
            margin-bottom:8px;
        }

        .menu a:hover{
            background:#eff6ff;
            color:#2563eb;
        }

        .content{
            margin-left:250px;
        }

        .navbar-custom{
            background:white;
            padding:15px 25px;
            border-bottom:1px solid #e5e7eb;
        }

        .page-content{
            padding:25px;
        }

    </style>
</head>
<body>

<div class="sidebar">

    <div class="logo">
        HelpDesk Pro
    </div>

    <div class="menu">

        <a href="#">📊 Dashboard</a>

        <a href="{% url 'create_ticket' %}">🎫 Create Ticket</a>

        <a href="{% url 'my_tickets' %}">📁 My Tickets</a>

        <a href="#">🏢 Departments</a>

        <a href="#">📈 Reports</a>

        <a href="#">👥 Users</a>

        <a href="#">🚪 Logout</a>

    </div>

</div>

<div class="content">

    <div class="navbar-custom">

        <div class="d-flex justify-content-between">

            <h5 class="mb-0">Dashboard</h5>

            <span>
                Welcome, {{ request.user.username }}
            </span>

        </div>

    </div>

    <div class="page-content">

        {% block content %}
        {% endblock %}

    </div>

</div>

</body>
</html>
